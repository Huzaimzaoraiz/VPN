version: "3.8"

services:

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: vpn-controller
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/vpn_db}
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-key-min-32-chars-long-1234}
      GRPC_HOST: ${GRPC_HOST:-0.0.0.0}
      GRPC_PORT: ${GRPC_PORT:-50051}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-vpnoverlay@gmail.com}
    ports:
      - "8000:8000"
      - "50051:50051"

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: vpn-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
      - "8081:80"
    depends_on:
      - backend

  vpn-node:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.vpn_node
    container_name: vpn-gateway-node
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "51820:51820/udp"
    environment:
      CONTROLLER_GRPC_URL: backend:50051
      NODE_ID: gateway-docker-01
      HOSTNAME: gw-docker-01.vpn.internal
      NODE_TOKEN: ${NODE_TOKEN:-vpn_tok_your_token_here}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      LISTEN_PORT: 51820
      REGION: ${REGION:-us-east-1}
      MOCK_NETWORKING: ${MOCK_NETWORKING:-false}
    depends_on:
      - backend
